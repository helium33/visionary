# Netlify, when the site is connected to this Git repository. Set the six
# VITE_FIREBASE_* variables under Site configuration → Environment variables,
# or the build falls back to demo data (see src/lib/firebase.js).
# A drag-and-drop deploy of a built dist/ folder skips this file and uses
# public/_redirects and public/_headers, which Vite copies into dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
