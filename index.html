<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <title>Visionary — Wholesale Eyewear ERP</title>
    <script>
      // Apply a saved light/dark choice before first paint (ThemeContext
      // takes over once React loads), so a dark-mode user never sees a white flash.
      try {
        var theme = localStorage.getItem('visionary.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Painted before any JavaScript downloads; React replaces it on mount.
           Mirrors LoadingScreen (src/components/ui/LoadingScreen.jsx). -->
      <div class="flex min-h-screen flex-col items-center justify-center gap-5 bg-plane" role="status" aria-label="Loading">
        <div class="relative grid h-24 w-24 place-items-center">
          <span class="absolute inset-0 rounded-full border-[3px] border-line-hair border-t-brand-primary motion-safe:animate-spin" aria-hidden="true"></span>
          <span class="grid h-14 w-14 place-items-center rounded-2xl bg-brand-primary text-white motion-safe:animate-breathe">
            <svg viewBox="0 0 34 56" class="h-8 w-5" fill="none" aria-hidden="true">
              <rect x="3" y="3" width="5" height="50" rx="2.5" fill="currentColor" />
              <circle cx="17" cy="15.5" r="12.5" stroke="currentColor" stroke-width="4" />
              <circle cx="17" cy="40.5" r="12.5" stroke="currentColor" stroke-width="4" />
            </svg>
          </span>
        </div>
        <p class="text-sm font-medium text-ink-secondary">&nbsp;</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
